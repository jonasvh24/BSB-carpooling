# Netlify deployment. Next.js is detected automatically (@netlify/plugin-nextjs).
# The database must be Postgres there (SQLite cannot live on a serverless file system):
# `netlify db init` provisions one and sets DATABASE_URL. See README "Netlify".
[build]
  command = "bash scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  DISABLE_CRON = "true"
  PRISMA_SCHEMA = "prisma/schema.postgres.prisma"

[functions]
  node_bundler = "esbuild"
